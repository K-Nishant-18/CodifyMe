spring.application.name=codifyme-backend

# Database Configuration
# Spring Boot automatically picks up SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, etc.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codifyme}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Opendear@123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Security
# In production (Render), set JWT_SECRET as an env var (use a long random string)
jwt.secret=${JWT_SECRET:verysecretkeythatshouldbechangedinproductionandstoredsecurely}

# Gemini AI Configuration
# In production (Render), set GEMINI_API_KEY as an env var
gemini.api.key=${GEMINI_API_KEY:AIzaSyASB9tM1uza8XK_9a65Z6tBQ9eVGMAELoI}

# Server
# Render injects PORT; fall back to 8080 for local dev
server.port=${PORT:8080}

# CORS — allowed origins (set FRONTEND_URL env var on Render after Vercel deploy)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
